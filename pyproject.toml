[project]
name = "dth"
version = "0.1.0"
description = "Certified tablebase for Drop the Handkerchief"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
]
paper = [
    "matplotlib>=3.10",
    "pandas>=2.3",
    "seaborn>=0.13",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
